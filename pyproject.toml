[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terai-router"
version = "0.8.0"
description = "Offline Thai intent router that tolerates typos. Small, CPU-only, no dependencies. Made with Sesame."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE"]
authors = [{ name = "Clanarong Tammaketuek (Bogus)" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["thai", "nlp", "intent", "intent-classification", "typo", "offline", "chatbot", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Thai",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/klanarongz2009-sketch/terai-router"
Repository = "https://github.com/klanarongz2009-sketch/terai-router"
Demo = "https://klanarongz2009-sketch.github.io/terai-router/"

[project.optional-dependencies]
train = ["numpy", "scipy"]
dev = ["pytest"]

[project.scripts]
terai = "terai_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terai_router = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
