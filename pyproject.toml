[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terai-router"
version = "0.16.0"
description = "Offline Thai intent router that tolerates typos. Small, CPU-only, no dependencies. Made with Sesame."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE", "NOTICE"]
authors = [{ name = "Clanarong Tammaketuek (klanarongz2009)" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["thai", "nlp", "intent", "intent-classification", "typo", "offline", "chatbot", "iot", "tts", "text-to-speech", "music", "text-to-music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Thai",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/klanarongz2009-sketch/terai-router"
Repository = "https://github.com/klanarongz2009-sketch/terai-router"
Demo = "https://klanarongz2009-sketch.github.io/terai-router/"

[project.optional-dependencies]
train = ["numpy", "scipy"]
dev = ["pytest"]
# TTH speech engines (the core install stays dependency-free).
# tth: local Wayu-Paxa-TTS-Edge (inference code Apache-2.0; weights CC-BY-NC-4.0, non-commercial, downloaded from
#      Hugging Face on first use, never shipped here) plus the edge-tts fallback. Needs Python 3.10+ (pulls torch).
# tth-edge: only the online edge-tts fallback (Microsoft service), small.
# tth-mtl: TTH-MTL, local OmniVoice by k2-fsa (code Apache-2.0; weights CC-BY-NC, non-commercial, about 3.3 GB,
#          downloaded from Hugging Face on first use, never shipped here). Multilingual. Needs Python 3.10+ (torch).
tth = [
    "wayu-tts @ git+https://github.com/wayu-research/wayu-tts-inference@07ab898d516649313926f0b843b809a962f993ad ; python_version >= '3.10'",
    "edge-tts>=6.1",
]
tth-edge = ["edge-tts>=6.1"]
tth-mtl = ["omnivoice>=0.2.1 ; python_version >= '3.10'"]
sankpup = ["resvg-py>=0.1.5", "Pillow>=9"]
sankpup-gemma = ["resvg-py>=0.1.5", "Pillow>=9", "llama-cpp-python>=0.3.36"]
# llm: model TERAI1BETA for terai chat / terai vision (local Gemma 4 through llama-cpp-python; weights Apache-2.0,
#      downloaded from Hugging Face by `terai chat --setup`, never shipped here).
llm = ["llama-cpp-python>=0.3.36"]

[project.scripts]
terai = "terai_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terai_router = ["data/*.json", "sankpup/data/*.json", "muml_wa/data/*.json", "muml_wa/data/*.txt", "temmo/runtime/*.js", "term_ai/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
